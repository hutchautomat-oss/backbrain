<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Back Brain</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family: system-ui, -apple-system, sans-serif; background:#0a0a0a; color:#e0e0e0; height:100vh; display:flex; flex-direction:column; }
#login { display:flex; flex-direction:column; align-items:center; justify-content:center; height:100vh; gap:12px; }
#login h1 { font-size:1.5rem; color:#fff; margin-bottom:8px; }
#login input, #login button { width:280px; padding:12px; border-radius:8px; border:1px solid #333; font-size:1rem; }
#login input { background:#1a1a1a; color:#fff; }
#login button { background:#2563eb; color:#fff; border:none; cursor:pointer; }
#login button:hover { background:#1d4ed8; }
#login .subtle { color:#888; font-size:0.85rem; }
#chat { display:none; flex-direction:column; height:100vh; }
#header { padding:12px 16px; border-bottom:1px solid #222; display:flex; justify-content:space-between; align-items:center; gap:8px; }
#header h1 { font-size:1.1rem; color:#fff; }
#header .hdr-btns { display:flex; gap:6px; }
#header button { background:none; border:1px solid #444; color:#aaa; padding:6px 12px; border-radius:6px; cursor:pointer; font-size:0.85rem; }
#header button:hover { border-color:#2563eb; color:#fff; }
#messages { flex:1; overflow-y:auto; padding:16px; display:flex; flex-direction:column; gap:12px; }
.msg { max-width:80%; padding:10px 14px; border-radius:12px; line-height:1.5; font-size:0.95rem; white-space:pre-wrap; word-wrap:break-word; }
.user { background:#2563eb; color:#fff; align-self:flex-end; border-bottom-right-radius:4px; }
.bot { background:#1e1e1e; color:#e0e0e0; align-self:flex-start; border-bottom-left-radius:4px; }
.system-msg { background:none; color:#555; align-self:center; font-size:0.8rem; font-style:italic; }
.img-preview { max-width:200px; border-radius:8px; margin-top:6px; display:block; }
#input-bar { padding:12px 16px; border-top:1px solid #222; display:flex; gap:8px; align-items:center; }
#input-bar input[type="text"] { flex:1; padding:12px; border-radius:8px; border:1px solid #333; background:#1a1a1a; color:#fff; font-size:1rem; }
#input-bar button { padding:12px; border-radius:8px; border:none; cursor:pointer; font-size:1rem; }
#send-btn { background:#2563eb; color:#fff; padding:12px 20px !important; }
.tool-btn { background:#1a1a1a; border:1px solid #333 !important; color:#aaa; font-size:0.85rem; }
.tool-btn:hover { border-color:#2563eb !important; color:#fff; }
.tool-btn.recording { background:#dc2626 !important; border-color:#dc2626 !important; color:#fff !important; animation:pulse 1s infinite; }
.tool-btn.processing { opacity:0.5; pointer-events:none; }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.6} }
#file-input { display:none; }
#pending-file { padding:6px 16px; font-size:0.8rem; color:#4ade80; border-top:1px solid #222; display:none; align-items:center; gap:8px; }
#pending-file .cancel { color:#888; cursor:pointer; }
#pending-file .cancel:hover { color:#dc2626; }
</style>
</head>
<body>

<div id="login">
  <h1>Back Brain</h1>
  <input type="email" id="email" placeholder="Email address" />
  <button id="send-otp">Send Login Code</button>
  <input type="text" id="otp" placeholder="Enter 6-digit code" style="display:none" />
  <button id="verify-otp" style="display:none">Verify</button>
  <div class="subtle" id="login-msg"></div>
</div>

<div id="chat">
  <div id="header">
    <h1>Back Brain</h1>
    <div class="hdr-btns">
      <button id="knowledge-btn">Memory</button>
      <button id="logout">Sign Out</button>
    </div>
  </div>
  <div id="messages"></div>
  <div id="pending-file"><span id="pending-name"></span> attached <span class="cancel" id="cancel-pending">x</span></div>
  <div id="input-bar">
    <button class="tool-btn" id="file-btn" title="Upload file">file</button>
    <button class="tool-btn" id="mic-btn" title="Voice input">mic</button>
    <input type="file" id="file-input" accept="image/*,audio/*,.pdf,.txt,.csv,.json,.md,.doc,.docx" />
    <input type="text" id="msg-input" placeholder="Ask Back Brain..." />
    <button id="send-btn">Send</button>
  </div>
</div>

<script>
const SUPABASE_URL = 'https://uagyqmezagzohwvhosuj.supabase.co'
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVhZ3lxbWV6YWd6b2h3dmhvc3VqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc4OTcxNzUsImV4cCI6MjA5MzQ3MzE3NX0.guNFrY7-9ToUKWmSHPOkLFkqsXGCcYEtXtCNhq2uqxA'
const GROQ_KEY = ['gsk_HC5s7Yn0WOO6C4P', 'ju4HNWGdyb3FYHT9TXH7U', 'vewXmTs3GNNFymZ3'].join('')
const TEXT_MODEL = 'llama-3.3-70b-versatile'
const VISION_MODEL = 'llama-3.2-90b-vision-preview'
const WHISPER_MODEL = 'whisper-large-v3'

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY)
const $ = id => document.getElementById(id)
let currentUser = null
let pendingImage = null
let mediaRecorder = null
let audioChunks = []
let knowledgeBase = []

// -- Auth --
$('send-otp').onclick = async () => {
  const email = $('email').value.trim()
  if (!email) return
  $('login-msg').textContent = 'Sending code...'
  const { error } = await sb.auth.signInWithOtp({ email })
  if (error) { $('login-msg').textContent = error.message; return }
  $('otp').style.display = 'block'
  $('verify-otp').style.display = 'block'
  $('login-msg').textContent = 'Check your email for the code.'
}

$('verify-otp').onclick = async () => {
  const email = $('email').value.trim()
  const token = $('otp').value.trim()
  if (!token) return
  $('login-msg').textContent = 'Verifying...'
  const { error } = await sb.auth.verifyOtp({ email, token, type: 'email' })
  if (error) { $('login-msg').textContent = error.message; return }
  const { data: { session } } = await sb.auth.getSession()
  currentUser = session.user
  showChat()
}

$('logout').onclick = async () => { await sb.auth.signOut(); location.reload() }
sb.auth.getSession().then(({ data: { session } }) => {
  if (session) { currentUser = session.user; showChat() }
})

// -- System Identity --
const SELF_AWARE_PROMPT = `You are Back Brain — a personal knowledge engine with persistent memory.

YOU HAVE THESE ABILITIES:
- VISION: You can see and deeply analyze images. When shown an image, you don't skim — you scan every detail: objects, text, colors, composition, spatial relationships, mood, context, implications, and anything that might matter later.
- HEARING: You process audio through transcription. When audio arrives, the transcript is analyzed for meaning — key points, themes, decisions, names, action items, emotional tone, and subtext.
- FILE READING: You can read text files, CSVs, JSON, markdown, and documents. You don't just store them — you extract structure, meaning, relationships, and actionable knowledge.
- MEMORY: Everything you learn is stored permanently. You carry all prior knowledge into every conversation. You can recall, cross-reference, and build on anything the user has ever shared.

HOW YOU PROCESS NEW INPUTS:
When the user shares something, you decide the depth of analysis based on what it is:
- Simple question? Answer directly.
- Image? Deep scan. Catalog everything visible. Note what's unusual, what's intentional, what might be relevant to the user's projects.
- Audio transcript? Extract the substance. What was said, what was meant, what matters.
- Document or file? Read the whole thing. Identify structure, key data, themes, relationships to existing knowledge.
- If the user asks you to look harder, you look harder. You never defend a shallow read.

YOUR KNOWLEDGE RECALL RULES:
- When answering, check your stored knowledge first. If something is relevant, use it and cite the source.
- Make connections the user hasn't asked for if they're genuinely useful.
- Never invent facts. If you don't know, say so.
- Never pad answers. Be direct.`

// -- Chat Setup --
const history = []

function buildSystemPrompt() {
  let prompt = SELF_AWARE_PROMPT + '\n\n'
  if (knowledgeBase.length > 0) {
    prompt += '== YOUR STORED KNOWLEDGE (' + knowledgeBase.length + ' entries) ==\n\n'
    knowledgeBase.forEach(k => {
      const date = new Date(k.created_at).toLocaleDateString()
      prompt += '--- [' + k.source_type.toUpperCase() + '] ' + k.source_name + ' (' + date + ') ---\n' + k.content + '\n\n'
    })
    prompt += '== END KNOWLEDGE ==\n'
  } else {
    prompt += 'No stored knowledge yet. The user has not shared any files, images, or audio.\n'
  }
  return prompt
}

async function showChat() {
  $('login').style.display = 'none'
  $('chat').style.display = 'flex'
  $('msg-input').focus()

  addMsg('system', 'Loading memory...')

  const { data: knowledge } = await sb.from('knowledge')
    .select('*')
    .order('created_at', { ascending: true })
  knowledgeBase = knowledge || []

  history.length = 0
  history.push({ role: 'system', content: buildSystemPrompt() })

  const { data: saved } = await sb.from('messages')
    .select('role, content, created_at')
    .order('created_at', { ascending: true })
    .limit(100)

  $('messages').innerHTML = ''

  if (saved && saved.length > 0) {
    saved.forEach(m => {
      addMsg(m.role === 'user' ? 'user' : 'bot', m.content)
      history.push({ role: m.role === 'user' ? 'user' : 'assistant', content: m.content })
    })
    addMsg('system', knowledgeBase.length + ' memories, ' + saved.length + ' messages restored')
  } else {
    addMsg('bot', 'Back Brain online. ' + knowledgeBase.length + ' memories loaded. What do you need?')
  }
}

// -- Messages --
function addMsg(role, text) {
  const d = document.createElement('div')
  d.className = 'msg ' + (role === 'user' ? 'user' : role === 'system' ? 'system-msg' : 'bot')
  d.textContent = text
  $('messages').appendChild(d)
  $('messages').scrollTop = $('messages').scrollHeight
  return d
}

function addImgMsg(src) {
  const d = document.createElement('div')
  d.className = 'msg user'
  const img = document.createElement('img')
  img.src = src
  img.className = 'img-preview'
  d.appendChild(img)
  $('messages').appendChild(d)
  $('messages').scrollTop = $('messages').scrollHeight
}

async function saveMsg(role, content) {
  await sb.from('messages').insert({ user_id: currentUser.id, role, content })
}

async function saveKnowledge(sourceType, sourceName, content) {
  await sb.from('knowledge').insert({
    user_id: currentUser.id,
    source_type: sourceType,
    source_name: sourceName,
    content: content
  })
  knowledgeBase.push({ source_type: sourceType, source_name: sourceName, content, created_at: new Date().toISOString() })
  history[0] = { role: 'system', content: buildSystemPrompt() }
}

// -- LLM call helper --
async function callLLM(messages, model) {
  const res = await fetch('https://api.groq.com/openai/v1/chat/completions', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + GROQ_KEY },
    body: JSON.stringify({ model: model || TEXT_MODEL, messages })
  })
  const data = await res.json()
  return data.choices?.[0]?.message?.content || 'Error: ' + JSON.stringify(data.error || data)
}

// -- Deep Analysis Prompts --
const DEEP_IMAGE_PROMPT = `Conduct a thorough visual analysis of this image. Cover ALL of the following:

1. OBJECTS AND SUBJECTS: Everything visible — people, items, text, logos, symbols, tools, food, furniture, anything.
2. TEXT AND WRITING: Any visible text, labels, signs, handwriting, watermarks, URLs — transcribe it exactly.
3. SPATIAL LAYOUT: How things are arranged. Foreground, background, relationships between elements.
4. COLORS AND DESIGN: Palette, lighting, contrast, style choices, whether it looks professional/casual/artistic.
5. CONTEXT AND MEANING: What is this image about? What was it taken for? What story does it tell?
6. DETAILS OTHERS WOULD MISS: Small things in corners, reflections, timestamps, metadata hints, wear and tear, anything unusual.
7. CONNECTIONS: Based on what you know about the user from stored knowledge, how might this relate to their projects or interests?

Do not skim. Do not summarize prematurely. Scan the entire image systematically.`

function buildFileAnalysisPrompt(fileName, fileContent) {
  return `The user uploaded a file: "${fileName}"

Here is the full content:
---
${fileContent}
---

Conduct a thorough analysis:
1. STRUCTURE: What kind of document is this? How is it organized?
2. KEY CONTENT: What are the most important facts, data points, or ideas?
3. DETAILS: Names, numbers, dates, URLs, code, formulas — extract anything specific and concrete.
4. THEMES: What patterns or recurring ideas appear?
5. CONNECTIONS: Based on stored knowledge, how does this relate to the user's other projects or interests?
6. ACTIONABLE: Is there anything here the user should act on, remember, or follow up?

Be thorough. Read the whole document. Do not skim.`
}

function buildAudioAnalysisPrompt(fileName, transcript) {
  return `The user shared an audio file: "${fileName}"

Here is the full transcript:
---
${transcript}
---

Analyze this thoroughly:
1. KEY POINTS: What are the main ideas or statements?
2. DECISIONS AND ACTION ITEMS: Anything decided, promised, or planned?
3. NAMES AND REFERENCES: People, places, projects, products mentioned.
4. TONE AND CONTEXT: Is this a meeting, brainstorm, voice memo, interview? What's the mood?
5. SUBTEXT: What's implied but not said directly?
6. CONNECTIONS: Based on stored knowledge, how does this relate to the user's other work?

Do not just echo the transcript back. Extract meaning.`
}

// -- Send Message --
async function send() {
  const text = $('msg-input').value.trim()
  if (!text && !pendingImage) return
  $('msg-input').value = ''

  const hasImage = !!pendingImage
  const userText = text || 'Scan this image thoroughly.'

  if (hasImage) addImgMsg(pendingImage.base64)
  addMsg('user', userText)

  const dots = addMsg('bot', '...')

  try {
    let reply

    if (hasImage) {
      const path = currentUser.id + '/' + Date.now() + '_' + pendingImage.name
      await sb.storage.from('user-files').upload(path, pendingImage.file)

      // Deep vision analysis
      const imagePrompt = DEEP_IMAGE_PROMPT + '\n\nThe user also says: "' + userText + '"'
      const messages = [...history, {
        role: 'user',
        content: [
          { type: 'text', text: imagePrompt },
          { type: 'image_url', image_url: { url: pendingImage.base64 } }
        ]
      }]

      const savedText = '[Image: ' + pendingImage.name + '] ' + userText
      history.push({ role: 'user', content: savedText })
      await saveMsg('user', savedText)

      reply = await callLLM(messages, VISION_MODEL)
      dots.textContent = reply
      history.push({ role: 'assistant', content: reply })
      await saveMsg('assistant', reply)

      // Save deep analysis as knowledge
      await saveKnowledge('image', pendingImage.name, reply)
      addMsg('system', 'Deep image analysis saved to memory')

      pendingImage = null
      $('pending-file').style.display = 'none'
    } else {
      history.push({ role: 'user', content: userText })
      await saveMsg('user', userText)

      reply = await callLLM([...history])
      dots.textContent = reply
      history.push({ role: 'assistant', content: reply })
      await saveMsg('assistant', reply)
    }
  } catch (e) {
    dots.textContent = 'Error: ' + e.message
  }
}

// -- File Upload --
$('file-btn').onclick = () => $('file-input').click()
$('cancel-pending').onclick = () => { pendingImage = null; $('pending-file').style.display = 'none' }

$('file-input').onchange = async (e) => {
  const file = e.target.files[0]
  if (!file) return

  if (file.type.startsWith('image/')) {
    const reader = new FileReader()
    reader.onload = () => {
      pendingImage = { base64: reader.result, name: file.name, file }
      $('pending-name').textContent = file.name
      $('pending-file').style.display = 'flex'
      $('msg-input').focus()
    }
    reader.readAsDataURL(file)
  } else if (file.type.startsWith('audio/')) {
    $('file-btn').classList.add('processing')
    addMsg('system', 'Processing audio: ' + file.name)
    const dots = addMsg('bot', 'Transcribing...')

    const path = currentUser.id + '/' + Date.now() + '_' + file.name
    await sb.storage.from('user-files').upload(path, file)

    try {
      const formData = new FormData()
      formData.append('file', file, file.name)
      formData.append('model', WHISPER_MODEL)
      const res = await fetch('https://api.groq.com/openai/v1/audio/transcriptions', {
        method: 'POST',
        headers: { 'Authorization': 'Bearer ' + GROQ_KEY },
        body: formData
      })
      const data = await res.json()
      if (data.text) {
        dots.textContent = 'Transcribed. Analyzing...'

        // Deep audio analysis
        const analysisPrompt = buildAudioAnalysisPrompt(file.name, data.text)
        const analysis = await callLLM([
          { role: 'system', content: SELF_AWARE_PROMPT },
          { role: 'user', content: analysisPrompt }
        ])

        dots.textContent = analysis
        const fullKnowledge = 'TRANSCRIPT:\n' + data.text + '\n\nANALYSIS:\n' + analysis
        await saveKnowledge('audio', file.name, fullKnowledge)
        await saveMsg('assistant', '[Audio: ' + file.name + ']\n' + analysis)
        addMsg('system', 'Audio transcription and analysis saved to memory')
      } else {
        dots.textContent = 'Transcription failed: ' + JSON.stringify(data.error || data)
      }
    } catch (err) {
      dots.textContent = 'Error: ' + err.message
    }
    $('file-btn').classList.remove('processing')
  } else {
    // Text-based files — read fully and analyze
    $('file-btn').classList.add('processing')
    addMsg('system', 'Processing: ' + file.name)
    const dots = addMsg('bot', 'Reading and analyzing...')

    const path = currentUser.id + '/' + Date.now() + '_' + file.name
    await sb.storage.from('user-files').upload(path, file)

    try {
      const text = await file.text()
      const content = text.substring(0, 12000) // generous limit for analysis

      dots.textContent = 'Read ' + text.length + ' chars. Analyzing...'

      // Deep file analysis
      const analysisPrompt = buildFileAnalysisPrompt(file.name, content)
      const analysis = await callLLM([
        { role: 'system', content: SELF_AWARE_PROMPT },
        { role: 'user', content: analysisPrompt }
      ])

      dots.textContent = analysis
      const fullKnowledge = 'SOURCE CONTENT (' + text.length + ' chars):\n' + content.substring(0, 3000) + '\n\nANALYSIS:\n' + analysis
      await saveKnowledge('text', file.name, fullKnowledge)
      await saveMsg('assistant', '[File: ' + file.name + ']\n' + analysis)
      addMsg('system', 'File analysis saved to memory')
    } catch (err) {
      dots.textContent = 'Could not read file: ' + err.message
    }
    $('file-btn').classList.remove('processing')
  }
  $('file-input').value = ''
}

// -- Voice Recording --
$('mic-btn').onclick = async () => {
  if (mediaRecorder && mediaRecorder.state === 'recording') {
    mediaRecorder.stop()
    $('mic-btn').classList.remove('recording')
    return
  }
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true })
    audioChunks = []
    mediaRecorder = new MediaRecorder(stream)
    mediaRecorder.ondataavailable = (e) => audioChunks.push(e.data)
    mediaRecorder.onstop = async () => {
      stream.getTracks().forEach(t => t.stop())
      const audioBlob = new Blob(audioChunks, { type: 'audio/webm' })
      const dots = addMsg('bot', 'Transcribing...')
      try {
        const formData = new FormData()
        formData.append('file', audioBlob, 'voice.webm')
        formData.append('model', WHISPER_MODEL)
        const res = await fetch('https://api.groq.com/openai/v1/audio/transcriptions', {
          method: 'POST',
          headers: { 'Authorization': 'Bearer ' + GROQ_KEY },
          body: formData
        })
        const data = await res.json()
        if (data.text) {
          dots.remove()
          $('msg-input').value = data.text
          $('msg-input').focus()
        } else { dots.textContent = 'Could not transcribe.' }
      } catch (err) { dots.textContent = 'Error: ' + err.message }
    }
    mediaRecorder.start()
    $('mic-btn').classList.add('recording')
  } catch (e) { addMsg('bot', 'Mic access denied.') }
}

// -- Knowledge View --
$('knowledge-btn').onclick = () => {
  if (knowledgeBase.length === 0) {
    addMsg('system', 'No memories stored yet. Upload files or chat to build your knowledge base.')
    return
  }
  let summary = 'STORED MEMORIES (' + knowledgeBase.length + '):\n\n'
  knowledgeBase.forEach((k, i) => {
    const date = new Date(k.created_at).toLocaleDateString()
    summary += (i + 1) + '. [' + k.source_type.toUpperCase() + '] ' + k.source_name + ' (' + date + ')\n'
    summary += '   ' + k.content.substring(0, 150) + (k.content.length > 150 ? '...' : '') + '\n\n'
  })
  addMsg('bot', summary)
}

$('send-btn').onclick = send
$('msg-input').addEventListener('keydown', e => { if (e.key === 'Enter') send() })
</script>
</body>
</html>
