<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Back Brain</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#0a0a0a;color:#e0e0e0;height:100vh;display:flex;justify-content:center;align-items:center}
        #auth{text-align:center;width:320px}
        #auth h1{font-size:1.8rem;color:#c8a84e;margin-bottom:8px}
        #auth .sub{color:#666;margin-bottom:24px;font-size:.9rem}
        #auth input{width:100%;padding:12px 16px;margin-bottom:12px;background:#1a1a1a;border:1px solid #333;border-radius:8px;color:#e0e0e0;font-size:1rem;outline:none}
        #auth input:focus{border-color:#c8a84e}
        #auth button{width:100%;padding:12px;background:#c8a84e;color:#0a0a0a;border:none;border-radius:8px;font-size:1rem;font-weight:600;cursor:pointer}
        #auth button:hover{background:#d4b65e}
        #err{color:#e74c3c;margin-top:12px;font-size:.85rem}
        #toggle{margin-top:16px;color:#666;font-size:.85rem}
        #toggle a{color:#c8a84e;cursor:pointer;text-decoration:none}
        #chat{display:none;flex-direction:column;width:100%;height:100vh;max-width:700px;margin:0 auto}
        #chat-head{padding:16px 20px;border-bottom:1px solid #222;display:flex;justify-content:space-between;align-items:center}
        #chat-head h2{color:#c8a84e;font-size:1.2rem}
        #chat-head button{background:none;border:1px solid #333;color:#666;padding:6px 12px;border-radius:6px;cursor:pointer;font-size:.8rem}
        #msgs{flex:1;overflow-y:auto;padding:20px}
        .m{margin-bottom:16px;max-width:80%}
        .m.u{margin-left:auto;text-align:right}
        .m .b{display:inline-block;padding:10px 16px;border-radius:12px;font-size:.95rem;line-height:1.5}
        .m.u .b{background:#c8a84e;color:#0a0a0a}
        .m.a .b{background:#1a1a1a;color:#e0e0e0}
        #bar{display:flex;padding:16px 20px;border-top:1px solid #222;gap:12px}
        #bar input{flex:1;padding:12px 16px;background:#1a1a1a;border:1px solid #333;border-radius:8px;color:#e0e0e0;font-size:1rem;outline:none}
        #bar input:focus{border-color:#c8a84e}
        #bar button{padding:12px 20px;background:#c8a84e;color:#0a0a0a;border:none;border-radius:8px;font-weight:600;cursor:pointer}
    </style>
</head>
<body>
<div id="auth">
    <h1>Back Brain</h1>
    <p class="sub">Universal memory mount</p>
    <input type="email" id="email" placeholder="Email" />
    <input type="password" id="password" placeholder="Password" />
    <button onclick="connect()">Connect</button>
    <div id="err"></div>
    <div id="toggle"><span id="tgl">No account? <a onclick="flip()">Sign up</a></span></div>
</div>
<div id="chat">
    <div id="chat-head">
        <h2>Back Brain</h2>
        <button onclick="logout()">Disconnect</button>
    </div>
    <div id="msgs"></div>
    <div id="bar">
        <input type="text" id="inp" placeholder="Ask anything..." onkeydown="if(event.key==='Enter')send()" />
        <button onclick="send()">Send</button>
    </div>
</div>
<script>
const API='https://uagyqmezagzohwvhosuj.supabase.co/functions/v1';
let tk=localStorage.getItem('bb_token'),mode='login';
if(tk)showChat();
function flip(){
    mode=mode==='login'?'signup':'login';
    document.getElementById('tgl').innerHTML=mode==='login'
        ?'No account? <a onclick="flip()">Sign up</a>'
        :'Have an account? <a onclick="flip()">Log in</a>';
}
async function connect(){
    const e=document.getElementById('email').value;
    const p=document.getElementById('password').value;
    const err=document.getElementById('err');
    err.textContent='';
    try{
        const r=await fetch(API+'/auth',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:e,password:p,action:mode})});
        const d=await r.json();
        if(!r.ok)throw new Error(d.error||'Connection failed');
        tk=d.access_token||d.token;
        if(!tk)throw new Error('No token received');
        localStorage.setItem('bb_token',tk);
        showChat();
    }catch(x){err.textContent=x.message}
}
function showChat(){
    document.getElementById('auth').style.display='none';
    document.getElementById('chat').style.display='flex';
}
function logout(){
    tk=null;localStorage.removeItem('bb_token');
    document.getElementById('chat').style.display='none';
    document.getElementById('auth').style.display='block';
}
async function send(){
    const i=document.getElementById('inp'),msg=i.value.trim();
    if(!msg)return;i.value='';
    addMsg(msg,'u');
    try{
        const r=await fetch(API+'/chat',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+tk},body:JSON.stringify({message:msg})});
        const d=await r.json();
        if(!r.ok){if(r.status===401){logout();return}throw new Error(d.error||'Failed')}
        addMsg(d.reply||d.response||d.message,'a');
    }catch(x){addMsg('Error: '+x.message,'a')}
}
function addMsg(t,c){
    const d=document.createElement('div');d.className='m '+c;
    d.innerHTML='<div class="b">'+t+'</div>';
    const m=document.getElementById('msgs');m.appendChild(d);m.scrollTop=m.scrollHeight;
}
</script>
</body>
</html>
