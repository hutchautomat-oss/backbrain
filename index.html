// ====== CRYPTO (AES-256-GCM + PBKDF2) ======
function b64Encode(buf) { return btoa(String.fromCharCode(...new Uint8Array(buf))) }
function b64Decode(str) { return Uint8Array.from(atob(str), c => c.charCodeAt(0)) }

async function deriveKey(password, salt) {
  const enc = new TextEncoder()
  const material = await crypto.subtle.importKey('raw', enc.encode(password), 'PBKDF2', false, ['deriveKey'])
  return crypto.subtle.deriveKey(
    { name: 'PBKDF2', salt, iterations: 100000, hash: 'SHA-256' },
    material, { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']
  )
}

async function vaultEncrypt(password, plaintext) {
  const salt = crypto.getRandomValues(new Uint8Array(16))
  const iv = crypto.getRandomValues(new Uint8Array(12))
  const key = await deriveKey(password, salt)
  const encrypted = await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, key, new TextEncoder().encode(plaintext))
  return { encrypted_data: b64Encode(encrypted), iv: b64Encode(iv), salt: b64Encode(salt) }
}

async function vaultDecrypt(password, encrypted_data, iv, salt) {
  const key = await deriveKey(password, b64Decode(salt))
  const decrypted = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64Decode(iv) }, key, b64Decode(encrypted_data))
  return new TextDecoder().decode(decrypted)
}

    var commit = await this.api('/repos/' + this.owner + '/' + repo + '/git/commits/' + latestSha)

        <span class="ve-name">${entry.name}</span>

      </div>
      <div class="ve-secret" id="vs-${entry.id}">••••••••</div>
    `
    div.querySelector('.reveal').onclick = async function() {
      const secretEl = $('vs-' + entry.id)
      if (secretEl.style.display === 'block') {
        secretEl.style.display = 'none'
        secretEl.textContent = '••••••••'
        this.textContent = 'show'
        return
      }
      try {
        const plain = await vaultDecrypt(vaultKey, entry.encrypted_data, entry.iv, entry.salt)
        secretEl.textContent = plain
        secretEl.style.display = 'block'
        this.textContent = 'hide'
      } catch { secretEl.textContent = 'Decrypt failed'; secretEl.style.display = 'block' }
    }
    div.querySelector('.copy').onclick = async () => {
      try {
        const plain = await vaultDecrypt(vaultKey, entry.encrypted_data, entry.iv, entry.salt)
        await navigator.clipboard.writeText(plain)
        const btn = div.querySelector('.copy')
        btn.textContent = '✓'
        setTimeout(() => btn.textContent = 'copy', 1500)
      } catch { /* silent */ }
    }
    div.querySelector('.del').onclick = async () => {
      if (!confirm('Delete "' + entry.name + '"?')) return
      await sb.from('vault').delete().eq('id', entry.id)
      await loadVaultEntries()
    }
    container.appendChild(div)
  })
}

const history = []

function buildSystemPrompt() {
  let prompt = SELF_AWARE_PROMPT + '\n\n'
  if (latestGrounding) {
    prompt += '== GROUNDING DOCUMENT (your consolidated understanding) ==\n' + latestGrounding + '\n== END GROUNDING ==\n\n'
  }
  if (knowledgeBase.length > 0) {
    prompt += '== STORED KNOWLEDGE (' + knowledgeBase.length + ' entries) ==\n\n'
    const entries = latestGrounding ? knowledgeBase.slice(-15) : knowledgeBase
    entries.forEach(k => {
      const date = new Date(k.created_at).toLocaleDateString()
      prompt += '--- [' + k.source_type.toUpperCase() + '] ' + k.source_name + ' (' + date + ') ---\n'
      prompt += k.content.substring(0, latestGrounding ? 500 : 2000) + '\n\n'
    })
    prompt += '== END KNOWLEDGE ==\n'
  } else {
    prompt += 'No stored knowledge yet.\n'
  }
  return prompt
}

async function showChat() {
  $('login').style.display = 'none'
  $('chat').style.display = 'flex'
  $('msg-input').focus()
  addMsg('system', 'Loading memory...')

  const { data: knowledge } = await sb.from('knowledge').select('*').order('created_at', { ascending: true })
  knowledgeBase = knowledge || []

  const { data: groundingDocs } = await sb.from('grounding_docs').select('content, message_count, created_at').order('created_at', { ascending: false }).limit(1)
  latestGrounding = groundingDocs?.[0]?.content || null

  history.length = 0
  history.push({ role: 'system', content: buildSystemPrompt() })

  const { data: saved } = await sb.from('messages').select('role, content, created_at').order('created_at', { ascending: true }).limit(100)
  $('messages').innerHTML = ''

  if (saved && saved.length > 0) {
    saved.forEach(m => {
      addMsg(m.role === 'user' ? 'user' : 'bot', m.content)
      history.push({ role: m.role === 'user' ? 'user' : 'assistant', content: m.content })
    })
    const status = []
    status.push(knowledgeBase.length + ' memories')
    status.push(saved.length + ' messages')
    if (latestGrounding) status.push('grounding active')
    if (webSearchAvailable) status.push('web search ready')
    const active = PROVIDERS.filter(p => p.key).length
    status.push(active + ' AI providers')
    status.push('GitHub API ready')
    addMsg('system', status.join(' / '))
  } else {
    addMsg('bot', 'Back Brain online. ' + knowledgeBase.length + ' memories loaded.' + (latestGrounding ? ' Grounding active.' : '') + ' GitHub API ready. What do you need?')
  }
}

// ====== MESSAGES ======
function addMsg(role, text) {
  const d = document.createElement('div')
  d.className = 'msg ' + (role === 'user' ? 'user' : role === 'system' ? 'system-msg' : 'bot')
  d.textContent = text
  $('messages').appendChild(d)
  $('messages').scrollTop = $('messages').scrollHeight
  return d
}

function addImgMsg(src) {
  const d = document.createElement('div')
  d.className = 'msg user'
  const img = document.createElement('img')
  img.src = src
  img.className = 'img-preview'
  d.appendChild(img)
  $('messages').appendChild(d)
  $('messages').scrollTop = $('messages').scrollHeight
}

async function saveMsg(role, content) {
  await sb.from('messages').insert({ user_id: currentUser.id, role, content })
}

async function saveKnowledge(sourceType, sourceName, content) {
  await sb.from('knowledge').insert({ user_id: currentUser.id, source_type: sourceType, source_name: sourceName, content })
  knowledgeBase.push({ source_type: sourceType, source_name: sourceName, content, created_at: new Date().toISOString() })
  history[0] = { role: 'system', content: buildSystemPrompt() }
}

// ====== LLM WITH PROVIDER ROTATION ======
async function callLLM(messages, model) {
  if (model) {
    const res = await fetch('https://api.groq.com/openai/v1/chat/completions', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + GROQ_KEY },
      body: JSON.stringify({ model, messages })
    })
    const data = await res.json()
    return data.choices?.[0]?.message?.content || 'Error: ' + JSON.stringify(data.error || data)
  }

  for (const p of PROVIDERS) {
    if (!p.key) continue
    try {
      const res = await fetch(p.url, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + p.key },
        body: JSON.stringify({ model: p.model, messages })
      })
      if (res.status === 429) {
        addMsg('system', p.name + ' busy, switching...')
        continue
      }
      const data = await res.json()
      const content = data.choices?.[0]?.message?.content
      if (content) return content
      continue
    } catch {
      continue
    }
  }
  return 'All providers busy. Try again in a minute.'
}

// ====== WEB SEARCH ======
async function braveSearch(query) {
  try {
    const res = await fetch('https://api.search.brave.com/res/v1/web/search?q=' + encodeURIComponent(query) + '&count=5', {
      headers: { 'Accept': 'application/json', 'X-Subscription-Token': BRAVE_KEY }
    })
    if (!res.ok) throw new Error('Status ' + res.status)
    const data = await res.json()
    const results = data.web?.results || []
    return results.map(r => '- ' + r.title + '\n  ' + r.url + '\n  ' + (r.description || '')).join('\n\n')
  } catch (e) {
    if (e.message.includes('Failed to fetch') || e.message.includes('CORS') || e.message.includes('NetworkError')) {
      webSearchAvailable = false
    }
    return null
  }
}

async function shouldSearch(userMessage) {
  if (!webSearchAvailable) return { search: false }
  try {
    const knowledgeTopics = knowledgeBase.length > 0 ? knowledgeBase.map(k => k.source_name).join(', ') : 'none'
    const result = await callLLM([
      { role: 'system', content: 'You decide if a web search is needed. Respond with ONLY valid JSON, nothing else.\nFormat: {"search": true, "query": "search terms"} or {"search": false}\n\nSearch when: current events, specific facts not in stored knowledge, URLs, products, companies, people, prices, technical specs.\nDo NOT search when: the user is chatting, asking about their own files, or the answer is clearly in stored knowledge.' },
      { role: 'user', content: 'Stored knowledge topics: ' + knowledgeTopics + '\n\nUser says: ' + userMessage }
    ])
    const cleaned = result.replace(/```json\n?/g, '').replace(/```\n?/g, '').trim()
    return JSON.parse(cleaned)
  } catch { return { search: false } }
}

// ====== GROUNDING ======
async function runGrounding() {
  addMsg('system', 'Grounding in progress...')
  const knowledgeDump = knowledgeBase.map(k => {
    const date = new Date(k.created_at).toLocaleDateString()
    return '[' + k.source_type.toUpperCase() + '] ' + k.source_name + ' (' + date + '):\n' + k.content
  }).join('\n\n---\n\n')
  const recentChat = history.slice(-30).filter(h => h.role !== 'system').map(h => h.role + ': ' + h.content).join('\n')
  const groundingPrompt = `Review everything below. Create a GROUNDING DOCUMENT — Back Brain's consolidated understanding.

STRUCTURE:
1. CORE IDENTITY: Who is the user? Key projects, interests, goals.
2. ACTIVE PROJECTS: Status of each. What is decided, what is pending.
3. KEY FACTS: Names, dates, numbers, decisions, preferences, URLs, technical details.
4. RELATIONSHIPS: How projects and ideas connect to each other.
5. OPEN THREADS: Unresolved questions, pending decisions, follow-ups.
6. PATTERNS: User communication style, preferences, recurring themes.

RULES:
- Proper nouns, URLs, numbers, dates, decisions, and technical specs are NEVER summarized — keep at full fidelity.
- Merge redundant entries that say the same thing in different words into one.
- Drop conversational filler (greetings, acknowledgments, restated questions).
- Collapse sequential status updates into latest-state-only — flag if a reversal occurred.
- Relationships between projects and people stay intact.
- If two facts contradict, keep both and mark the conflict.
- Be factual. No speculation.
- Target 40% shorter than raw input without losing a single retrievable fact.

== ALL STORED KNOWLEDGE ==
${knowledgeDump}

== RECENT CONVERSATION ==
${recentChat}`

  const doc = await callLLM([
    { role: 'system', content: 'You create grounding documents. Be thorough, factual, and organized.' },
    { role: 'user', content: groundingPrompt }
  ])
  await sb.from('grounding_docs').insert({ user_id: currentUser.id, content: doc, message_count: knowledgeBase.length })
  latestGrounding = doc
  history[0] = { role: 'system', content: buildSystemPrompt() }
  sessionMsgCount = 0
  addMsg('system', 'Grounding complete. Context consolidated.')
  return doc
}

async function maybeAutoGround() {
  sessionMsgCount++
  if (sessionMsgCount >= GROUNDING_INTERVAL) await runGrounding()
}

// ====== ANALYSIS PROMPTS ======
const DEEP_IMAGE_PROMPT = `Conduct a thorough visual analysis. Cover ALL:
1. OBJECTS AND SUBJECTS: Everything visible — people, items, text, logos, symbols, tools, food, furniture.
2. TEXT AND WRITING: Any visible text, labels, signs, handwriting — transcribe exactly.
3. SPATIAL LAYOUT: Arrangement, foreground, background, relationships between elements.
4. COLORS AND DESIGN: Palette, lighting, contrast, style, professional vs casual vs artistic.
5. CONTEXT AND MEANING: What is this image about? What was it taken for?
6. DETAILS OTHERS WOULD MISS: Corners, reflections, timestamps, wear, anything unusual.
7. CONNECTIONS: How might this relate to the user's known projects or interests?
Do not skim. Scan the entire image systematically.`

function buildFileAnalysisPrompt(fileName, fileContent) {
  return `File uploaded: "${fileName}"\n\nContent:\n---\n${fileContent}\n---\n\nAnalyze thoroughly:\n1. STRUCTURE: What kind of document?\n2. KEY CONTENT: Most important facts, data, ideas.\n3. DETAILS: Names, numbers, dates, URLs, code.\n4. THEMES: Patterns, recurring ideas.\n5. CONNECTIONS: How does this relate to user's other projects?\n6. ACTIONABLE: Anything to act on or follow up?`
}

function buildAudioAnalysisPrompt(fileName, transcript) {
  return `Audio file: "${fileName}"\n\nTranscript:\n---\n${transcript}\n---\n\nAnalyze:\n1. KEY POINTS: Main ideas.\n2. DECISIONS AND ACTION ITEMS.\n3. NAMES AND REFERENCES.\n4. TONE AND CONTEXT.\n5. SUBTEXT: What is implied?\n6. CONNECTIONS to user's other work.`
}

// ====== SEND MESSAGE ======
async function send() {
  const text = $('msg-input').value.trim()
  if (!text && !pendingImage) return
  $('msg-input').value = ''
  const hasImage = !!pendingImage
  const userText = text || 'Scan this image thoroughly.'
  if (hasImage) addImgMsg(pendingImage.base64)
  addMsg('user', userText)
  const dots = addMsg('bot', '...')

  try {
    let reply

    if (userText.startsWith('/build ')) {
      const buildRequest = userText.substring(7).trim()
      dots.textContent = 'Architecting...'
      addMsg('system', 'Entering architect mode...')

      let specPrompt = BUILD_SPEC_PROMPT + '\n\n'
      if (latestGrounding) {
        specPrompt += '== YOUR KNOWLEDGE (use this to inform the design) ==\n' + latestGrounding + '\n== END KNOWLEDGE ==\n\n'
      }
      if (knowledgeBase.length > 0) {
        specPrompt += '== DOMAIN EXPERTISE (' + knowledgeBase.length + ' entries) ==\n'
        knowledgeBase.slice(-10).forEach(k => {
          specPrompt += '[' + k.source_type.toUpperCase() + '] ' + k.source_name + ': ' + k.content.substring(0, 300) + '\n'
        })
        specPrompt += '== END EXPERTISE ==\n'
      }

      reply = await callLLM([
        { role: 'system', content: specPrompt },
        { role: 'user', content: 'Build this: ' + buildRequest }
      ])

      dots.textContent = reply
      history.push({ role: 'user', content: userText })
      history.push({ role: 'assistant', content: reply })
      await saveMsg('user', userText)
      await saveMsg('assistant', reply)
      await saveKnowledge('spec', buildRequest, reply)
      addMsg('system', 'App spec saved to memory')

    } else if (hasImage) {
      const path = currentUser.id + '/' + Date.now() + '_' + pendingImage.name
      await sb.storage.from('user-files').upload(path, pendingImage.file)
      const imagePrompt = DEEP_IMAGE_PROMPT + '\n\nThe user says: "' + userText + '"'
      const messages = [...history, { role: 'user', content: [{ type: 'text', text: imagePrompt }, { type: 'image_url', image_url: { url: pendingImage.base64 } }] }]
      const savedText = '[Image: ' + pendingImage.name + '] ' + userText
      history.push({ role: 'user', content: savedText })
      await saveMsg('user', savedText)
      reply = await callLLM(messages, VISION_MODEL)
      dots.textContent = reply
      history.push({ role: 'assistant', content: reply })
      await saveMsg('assistant', reply)
      await saveKnowledge('image', pendingImage.name, reply)
      addMsg('system', 'Deep image analysis saved to memory')
      pendingImage = null
      $('pending-file').style.display = 'none'

    } else {
      dots.textContent = 'Thinking...'
      const searchDecision = await shouldSearch(userText)
      let webContext = ''
      if (searchDecision.search && searchDecision.query) {
        dots.textContent = 'Searching: ' + searchDecision.query + '...'
        addMsg('system', 'Searching web: ' + searchDecision.query)
        const results = await braveSearch(searchDecision.query)
        if (results) {
          webContext = '\n\n== WEB SEARCH RESULTS for "' + searchDecision.query + '" ==\n' + results + '\n== END SEARCH ==\n\nSynthesize using web results + stored knowledge + conversation. Cite sources with [memory], [web], or [conversation].'
        } else if (!webSearchAvailable) {
          addMsg('system', 'Web search unavailable (CORS). Answering from memory only.')
        }
      }
      history.push({ role: 'user', content: userText })
      await saveMsg('user', userText)
      const answerMessages = [...history]
      if (webContext) answerMessages.push({ role: 'system', content: webContext })
      reply = await callLLM(answerMessages)
      dots.textContent = reply
      history.push({ role: 'assistant', content: reply })
      await saveMsg('assistant', reply)
    }
    await maybeAutoGround()
  } catch (e) { dots.textContent = 'Error: ' + e.message }
}

// ====== FILE UPLOAD ======
$('file-btn').onclick = () => $('file-input').click()
$('cancel-pending').onclick = () => { pendingImage = null; $('pending-file').style.display = 'none' }

$('file-input').onchange = async (e) => {
  const file = e.target.files[0]
  if (!file) return

  if (file.type.startsWith('image/')) {
    const reader = new FileReader()
    reader.onload = () => {
      pendingImage = { base64: reader.result, name: file.name, file }
      $('pending-name').textContent = file.name
      $('pending-file').style.display = 'flex'
      $('msg-input').focus()
    }
    reader.readAsDataURL(file)
  } else if (file.type.startsWith('audio/')) {
    $('file-btn').classList.add('processing')
    addMsg('system', 'Processing audio: ' + file.name)
    const dots = addMsg('bot', 'Transcribing...')
    const path = currentUser.id + '/' + Date.now() + '_' + file.name
    await sb.storage.from('user-files').upload(path, file)
    try {
      const formData = new FormData()
      formData.append('file', file, file.name)
      formData.append('model', WHISPER_MODEL)
      const res = await fetch('https://api.groq.com/openai/v1/audio/transcriptions', { method: 'POST', headers: { 'Authorization': 'Bearer ' + GROQ_KEY }, body: formData })
      const data = await res.json()
      if (data.text) {
        dots.textContent = 'Transcribed. Analyzing...'
        const analysis = await callLLM([{ role: 'system', content: SELF_AWARE_PROMPT }, { role: 'user', content: buildAudioAnalysisPrompt(file.name, data.text) }])
        dots.textContent = analysis
        await saveKnowledge('audio', file.name, 'TRANSCRIPT:\n' + data.text + '\n\nANALYSIS:\n' + analysis)
        await saveMsg('assistant', '[Audio: ' + file.name + ']\n' + analysis)
        addMsg('system', 'Audio analysis saved to memory')
      } else { dots.textContent = 'Transcription failed: ' + JSON.stringify(data.error || data) }
    } catch (err) { dots.textContent = 'Error: ' + err.message }
    $('file-btn').classList.remove('processing')
  } else {
    $('file-btn').classList.add('processing')
    addMsg('system', 'Processing: ' + file.name)
    const dots = addMsg('bot', 'Reading and analyzing...')
    const path = currentUser.id + '/' + Date.now() + '_' + file.name
    await sb.storage.from('user-files').upload(path, file)
    try {
      const text = await file.text()
      const content = text.substring(0, 12000)
      dots.textContent = 'Read ' + text.length + ' chars. Analyzing...'
      const analysis = await callLLM([{ role: 'system', content: SELF_AWARE_PROMPT }, { role: 'user', content: buildFileAnalysisPrompt(file.name, content) }])
      dots.textContent = analysis
      await saveKnowledge('text', file.name, 'SOURCE (' + text.length + ' chars):\n' + content.substring(0, 3000) + '\n\nANALYSIS:\n' + analysis)
      await saveMsg('assistant', '[File: ' + file.name + ']\n' + analysis)
      addMsg('system', 'File analysis saved to memory')
    } catch (err) { dots.textContent = 'Could not read file: ' + err.message }
    $('file-btn').classList.remove('processing')
  }
  $('file-input').value = ''
}

// ====== VOICE RECORDING ======
$('mic-btn').onclick = async () => {
  if (mediaRecorder && mediaRecorder.state === 'recording') {
    mediaRecorder.stop()
    $('mic-btn').classList.remove('recording')
    return
  }
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true })
    audioChunks = []
    mediaRecorder = new MediaRecorder(stream)
    mediaRecorder.ondataavailable = (e) => audioChunks.push(e.data)
    mediaRecorder.onstop = async () => {
      stream.getTracks().forEach(t => t.stop())
      const audioBlob = new Blob(audioChunks, { type: 'audio/webm' })
      const dots = addMsg('bot', 'Transcribing...')
      try {
        const formData = new FormData()
        formData.append('file', audioBlob, 'voice.webm')
        formData.append('model', WHISPER_MODEL)
        const res = await fetch('https://api.groq.com/openai/v1/audio/transcriptions', { method: 'POST', headers: { 'Authorization': 'Bearer ' + GROQ_KEY }, body: formData })
        const data = await res.json()
        if (data.text) { dots.remove(); $('msg-input').value = data.text; $('msg-input').focus() }
        else { dots.textContent = 'Could not transcribe.' }
      } catch (err) { dots.textContent = 'Error: ' + err.message }
    }
    mediaRecorder.start()
    $('mic-btn').classList.add('recording')
  } catch (e) { addMsg('bot', 'Mic access denied.') }
}

// ====== KNOWLEDGE VIEW ======
$('knowledge-btn').onclick = () => {
  if (knowledgeBase.length === 0) { addMsg('system', 'No memories stored yet.'); return }
  let summary = 'STORED MEMORIES (' + knowledgeBase.length + '):\n\n'
  knowledgeBase.forEach((k, i) => {
    const date = new Date(k.created_at).toLocaleDateString()
    summary += (i + 1) + '. [' + k.source_type.toUpperCase() + '] ' + k.source_name + ' (' + date + ')\n'
    summary += '   ' + k.content.substring(0, 150) + (k.content.length > 150 ? '...' : '') + '\n\n'
  })
  if (latestGrounding) summary += '---\nGROUNDING DOC (active):\n' + latestGrounding.substring(0, 500) + '...'
  addMsg('bot', summary)
}

$('ground-btn').onclick = () => {
  if (knowledgeBase.length === 0 && history.length <= 1) { addMsg('system', 'Nothing to ground yet.'); return }
  runGrounding()
}

$('send-btn').onclick = send
$('msg-input').addEventListener('keydown', e => { if (e.key === 'Enter') send() })
</script>
