<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Back Brain</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, system-ui, sans-serif; background: #0a0a0a; color: #e0e0e0; height: 100vh; display: flex; flex-direction: column; }
#login { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; gap: 12px; }
#login input { padding: 12px 16px; width: 280px; border-radius: 8px; border: 1px solid #333; background: #1a1a1a; color: #e0e0e0; font-size: 16px; }
#login button { padding: 12px 24px; border-radius: 8px; border: none; background: #d4a574; color: #0a0a0a; font-weight: 600; cursor: pointer; font-size: 16px; }
#chat { display: none; flex-direction: column; height: 100vh; }
#messages { flex: 1; overflow-y: auto; padding: 20px; }
.msg { margin: 8px 0; padding: 12px 16px; border-radius: 12px; max-width: 80%; white-space: pre-wrap; }
.user { background: #d4a574; color: #0a0a0a; margin-left: auto; }
.bot { background: #1a1a1a; }
#input-bar { display: flex; padding: 12px; gap: 8px; border-top: 1px solid #222; }
#input-bar input { flex: 1; padding: 12px 16px; border-radius: 8px; border: 1px solid #333; background: #1a1a1a; color: #e0e0e0; font-size: 16px; }
#input-bar button { padding: 12px 20px; border-radius: 8px; border: none; background: #d4a574; color: #0a0a0a; font-weight: 600; cursor: pointer; }
.ctx { font-size: 11px; color: #666; text-align: center; margin: 4px 0; }
</style>
</head>
<body>

<div id="login">
  <h2 style="color:#d4a574; margin-bottom:12px;">Back Brain</h2>
  <input id="email" type="email" placeholder="Email">
  <input id="pass" type="password" placeholder="Password">
  <button onclick="login()">Connect</button>
  <div id="login-err" style="color:#ff6b6b; font-size:13px;"></div>
</div>

<div id="chat">
  <div style="padding:12px 20px; border-bottom:1px solid #222; display:flex; justify-content:space-between; align-items:center;">
    <span style="color:#d4a574; font-weight:600;">Back Brain</span>
    <span id="ctx-count" style="font-size:12px; color:#666;"></span>
  </div>
  <div id="messages"></div>
  <div id="input-bar">
    <input id="msg" placeholder="Talk to your brain..." onkeydown="if(event.key==='Enter')send()">
    <button onclick="send()">Send</button>
  </div>
</div>

<script>
const API = 'https://uagyqmezagzohwvhosuj.supabase.co/functions/v1'
let token = null
let history = []

async function login() {
  const email = document.getElementById('email').value
  const pass = document.getElementById('pass').value
  try {
    const r = await fetch(API + '/auth-handler/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, password: pass })
    })
    const d = await r.json()
    if (d.access_token) {
      token = d.access_token
      document.getElementById('login').style.display = 'none'
      document.getElementById('chat').style.display = 'flex'
    } else {
      document.getElementById('login-err').textContent = d.error || 'Login failed'
    }
  } catch(e) {
    document.getElementById('login-err').textContent = 'Connection error'
  }
}

function addMsg(text, cls) {
  const d = document.getElementById('messages')
  const m = document.createElement('div')
  m.className = 'msg ' + cls
  m.textContent = text
  d.appendChild(m)
  d.scrollTop = d.scrollHeight
}

async function send() {
  const input = document.getElementById('msg')
  const text = input.value.trim()
  if (!text) return
  input.value = ''
  addMsg(text, 'user')
  history.push({ role: 'user', text })

  try {
    const r = await fetch(API + '/chat-handler', {
      method: 'POST',
      headers: { 'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: text, history: history.slice(-10) })
    })
    const d = await r.json()
    if (d.reply) {
      addMsg(d.reply, 'bot')
      history.push({ role: 'model', text: d.reply })
      document.getElementById('ctx-count').textContent = `${d.context_size.domains}d · ${d.context_size.entities}e · ${d.context_size.memory}m`
    } else {
      addMsg('Error: ' + JSON.stringify(d), 'bot')
    }
  } catch(e) {
    addMsg('Connection error', 'bot')
  }
}
</script>
</body>
</html>
